name: Python Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lightweight_sim/requirements.txt

      - name: Install Python test dependencies
        run: python -m pip install -r lightweight_sim/requirements.txt

      - name: Run lightweight simulator unit tests
        run: >-
          python -m pytest -q lightweight_sim/tests
          --ignore=lightweight_sim/tests/test_controller_manager.py
          --ignore=lightweight_sim/tests/test_controller_speed_profile.py
          --ignore=lightweight_sim/tests/test_ros_lifecycle.py

      - name: Run standalone parking-module unit tests
        run: python -m pytest -q parking_module/tests
