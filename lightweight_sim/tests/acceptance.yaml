# Performance budgets for the installed ROS graph, independent of node tuning.
# Use the smaller of the relative budget and the absolute error cap.
# Absolute caps preserve the previous acceptance policy when speed is raised.
speed_tracking:
  settling_time_s: 4.0
  rms_target_fraction: 0.015
  p95_target_fraction: 0.025
  peak_target_fraction: 0.05
  rms_max_kmh: 0.6
  p95_max_kmh: 1.0
  peak_max_kmh: 2.0
